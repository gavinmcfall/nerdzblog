{{- /*
  Sun/moon palette toggle. Both icons rendered; CSS hides the inactive one
  based on [data-theme] so the static Hugo output flips cleanly when JS
  toggles the attribute. Click handler is a tiny inline JS function defined
  in /js/theme-toggle.js (loaded by baseof.html).
*/ -}}
<button type="button" class="palette-toggle" aria-label="Toggle theme" onclick="toggleTheme()">
  <svg class="palette-toggle__sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
    <circle cx="12" cy="12" r="4" fill="currentColor" />
    <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="12" y1="2" x2="12" y2="4" /><line x1="12" y1="20" x2="12" y2="22" />
      <line x1="2" y1="12" x2="4" y2="12" /><line x1="20" y1="12" x2="22" y2="12" />
      <line x1="4.93" y1="4.93" x2="6.34" y2="6.34" /><line x1="17.66" y1="17.66" x2="19.07" y2="19.07" />
      <line x1="4.93" y1="19.07" x2="6.34" y2="17.66" /><line x1="17.66" y1="6.34" x2="19.07" y2="4.93" />
    </g>
  </svg>
  <svg class="palette-toggle__moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
    <path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
  </svg>
</button>
